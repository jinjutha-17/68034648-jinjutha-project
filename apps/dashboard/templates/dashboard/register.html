{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | Apartment Hub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1e40af;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --bg-light: #f8fafc;
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            margin: 0; 
            background: #fff;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            min-height: 100vh;
        }

        /* Left Panel */
        .left-panel {
            flex: 1.2;
            background: #1e40af;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: white;
            position: relative;
        }

        .left-panel::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .illustration {
            width: 85%;
            max-width: 480px;
            height: auto;
            z-index: 10;
            animation: float 5s ease-in-out infinite;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        .brand-text {
            z-index: 10;
            text-align: center;
            margin-top: 3rem;
        }

        .brand-text h1 { font-weight: 800; font-size: 3rem; margin-bottom: 0.5rem; letter-spacing: -1px; }
        .brand-text p { font-weight: 300; opacity: 0.8; font-size: 1.1rem; }

        /* Right Panel */
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            background: white;
        }

        .form-wrapper { width: 100%; max-width: 420px; }

        .login-header { margin-bottom: 2.5rem; text-align: left; }
        .login-header h2 { font-weight: 800; color: #1e293b; font-size: 2.2rem; margin-bottom: 0.5rem; }
        .login-header p { color: #64748b; font-size: 1rem; }

        .form-group-custom { margin-bottom: 1.25rem; position: relative; }
        
        .form-control-custom {
            width: 100%;
            padding: 14px 15px 14px 50px;
            border: 1.5px solid #e2e8f0;
            border-radius: 15px;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            z-index: 10;
        }

        .btn-premium {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-premium:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #64748b;
        }

        .footer-links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 992px) {
            .left-panel { display: none; }
            .right-panel { border-radius: 0; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="left-panel">
        <img src="https://raw.githubusercontent.com/otter-studio/el-templates/main/team.svg" alt="Team Illustration" class="illustration">
        <div class="brand-text">
            <h1>Apartment Hub</h1>
            <p>Join our community management platform.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="form-wrapper">
            <div class="login-header">
                <h2>สร้างบัญชีใหม่</h2>
                <p>กรุณากรอกข้อมูลเพื่อลงทะเบียนเข้าใช้งาน</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger rounded-3 small mb-4">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}
                
                <div class="form-group-custom">
                    <i class="fas fa-id-card input-icon"></i>
                    <input type="text" name="full_name" class="form-control-custom" placeholder="ชื่อ-นามสกุล" required>
                </div>

                <div class="form-group-custom">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email" class="form-control-custom" placeholder="อีเมล" required>
                </div>

                <div class="form-group-custom">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="username" class="form-control-custom" placeholder="ชื่อผู้ใช้งาน" required>
                </div>

                <div class="form-group-custom">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" class="form-control-custom" placeholder="รหัสผ่าน" required>
                </div>

                <div class="form-group-custom">
                    <i class="fas fa-check-double input-icon"></i>
                    <input type="password" name="password_confirm" class="form-control-custom" placeholder="ยืนยันรหัสผ่าน" required>
                </div>

                <button type="submit" class="btn-premium">
                    ลงทะเบียน <i class="fas fa-user-plus ms-2"></i>
                </button>
            </form>

            <div class="footer-links">
                มีบัญชีอยู่แล้ว? <a href="{% url 'login' %}">เข้าสู่ระบบที่นี่</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
