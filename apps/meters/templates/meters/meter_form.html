{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <h4>{{ title }}</h4>

    <form method="post">
        {% csrf_token %}

        {{ form.room|as_crispy_field }}
        {{ form.reading_value|as_crispy_field }}
        {{ form.water_charge|as_crispy_field }}
        {{ form.reading_date|as_crispy_field }}

        <button type="submit" class="btn btn-primary mt-3">บันทึก</button>
    </form>
</div>
{% endblock %}
