{% extends 'base.html' %}
{% block title %}Delete Room | Apartment Manager{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm" style="max-width:480px">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-3 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Delete Room</h5>
    <p>Are you sure you want to delete <strong>Room {{ room.room_number }}</strong>? This action cannot be undone.</p>
    <form method="post" class="d-flex gap-2 mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'rooms:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
