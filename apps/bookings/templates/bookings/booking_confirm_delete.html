{% extends 'base.html' %}
{% block title %}Delete Booking | Apartment Manager{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm" style="max-width:480px">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-3 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Delete Booking</h5>
    <p>Are you sure you want to delete <strong>Booking #{{ booking.pk }}</strong> for <strong>{{ booking.full_name }}</strong>?</p>
    <form method="post" class="d-flex gap-2 mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'bookings:list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
