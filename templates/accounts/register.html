{% extends "accounts/base.html" %}

{% block title %}Register · Apartment Hub{% endblock %}

{% block content %}
<h2 class="mb-4">Register</h2>
{% if messages %}
    <div class="alert alert-danger" role="alert">
        {% for message in messages %}
            {{ message }}<br>
        {% endfor %}
    </div>
{% endif %}
<form method="post" action="">
    {% csrf_token %}
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" class="form-control" id="username" placeholder="Choose a username" required>
    </div>
    <div class="mb-3">
        <label for="full_name" class="form-label">Full name</label>
        <input type="text" name="full_name" class="form-control" id="full_name" placeholder="Enter your full name">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Choose a password" required>
    </div>
    <div class="mb-3">
        <label for="password_confirm" class="form-label">Confirm password</label>
        <input type="password" name="password_confirm" class="form-control" id="password_confirm" placeholder="Confirm your password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Create account</button>
</form>
<div class="mt-3 text-center text-muted">
    <p>Already have an account? <a href="/accounts/login/">Sign in</a></p>
</div>
{% endblock %}
