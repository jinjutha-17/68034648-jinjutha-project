<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            margin: 0;
            font-family: 'Kanit', sans-serif;
        }
        .auth-shell {
            width: min(100%, 420px);
            padding: 2rem;
        }
        .auth-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 18px 60px rgba(30, 58, 138, 0.12);
            padding: 2rem;
            border-top: 4px solid #db2777;
        }
        .auth-brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .auth-brand h1 {
            font-size: 1.75rem;
            margin-bottom: 0.4rem;
        }
        .auth-brand p {
            color: #6c757d;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-brand">
            <h1>Apartment Hub</h1>
            <p>Secure login and registration pages for your project.</p>
        </div>
        <div class="auth-card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
